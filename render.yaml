services:
  - type: web
    name: student-complaint-system
    runtime: docker
    plan: free
    envVars:
      - key: DB_HOST
        value: your_db_host
      - key: DB_NAME
        value: your_db_name
      - key: DB_USER
        value: your_db_user
      - key: DB_PASS
        value: your_db_password